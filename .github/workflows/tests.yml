name: Tests

# F0.1: pruebas contra Postgres REAL + migraciones en BD limpia antes de pytest.
# Si una migración no aplica desde cero, el workflow falla (antes el CI era ciego a esto).
on:
  push:
    branches: [main, 'fase*/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kampfer_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/kampfer_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest httpx
      - name: Migraciones en BD limpia (la prueba que antes faltaba)
        run: alembic upgrade head
      - name: Ejecutar pruebas
        run: pytest -v
      # Validación E2E tareo→ISP (los 11 checks del arnés): levanta la API real
      # contra la BD migrada y recorre el circuito completo, incluida la
      # idempotencia del reenvío y las HH ganadas/gastadas exactas.
      - name: Validación E2E tareo→ISP
        run: |
          python -m uvicorn main:app --port 8765 --log-level warning &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8765/health && break || sleep 1
          done
          API_URL=http://localhost:8765 python scripts/validacion_e2e.py
        env:
          ENV: dev
